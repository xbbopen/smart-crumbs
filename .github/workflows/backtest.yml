name: 历史回测

on:
  workflow_dispatch:
    inputs:
      strategies:
        description: '策略名（空格分隔，默认 v1_default）'
        required: false
        default: 'v1_default'
      symbols:
        description: '覆盖标的（留空=使用 config.json 分层配置）'
        required: false
        default: ''
      start_date:
        description: '开始日期 YYYY-MM-DD（留空=全量）'
        required: false
        default: ''
      end_date:
        description: '结束日期 YYYY-MM-DD（留空=至今）'
        required: false
        default: ''
      asset_type:
        description: 'futures 或 spot'
        required: false
        default: 'futures'

concurrency:
  group: market-db-lock
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 恢复数据库
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
          restore-keys: |
            market-db-

      - run: pip install -r requirements.txt

      - name: 运行回测
        run: |
          python backtest.py \
            --strategies ${{ github.event.inputs.strategies }} \
            --symbols ${{ github.event.inputs.symbols }} \
            --start_date "${{ github.event.inputs.start_date }}" \
            --end_date "${{ github.event.inputs.end_date }}" \
            --asset_type ${{ github.event.inputs.asset_type }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      - name: 保存数据库到 Cache
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
