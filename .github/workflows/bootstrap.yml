name: 历史数据初始化

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: 运行 bootstrap
        run: python data_bootstrap.py --from-config --intervals 30m 4h

      - name: 压缩数据库
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from data_db import get_conn, db_size_mb
          print(f'压缩前: {db_size_mb():.2f} MB')
          conn = get_conn()
          conn.execute('VACUUM')
          conn.commit()
          conn.close()
          print(f'压缩后: {db_size_mb():.2f} MB')
          "

      - name: 提交数据库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.db
          git diff --staged --quiet || git commit -m "🤖 初始化历史行情数据 [skip ci]"
          git push
