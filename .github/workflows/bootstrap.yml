name: 历史数据初始化

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 尝试恢复已有 DB（如果有，会跳过已拉取的标的）
      - name: 恢复数据库
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}
          restore-keys: |
            market-db-

      - run: pip install -r requirements.txt

      - name: 运行 bootstrap
        run: python data_bootstrap.py --from-config --intervals 30m 4h

      - name: 压缩数据库
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from data_db import get_conn, db_size_mb
          print(f'压缩前: {db_size_mb():.2f} MB')
          conn = get_conn()
          conn.execute('VACUUM')
          conn.commit()
          conn.close()
          print(f'压缩后: {db_size_mb():.2f} MB')
          "

      - name: 保存数据库到 Cache
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ github.run_id }}

      - name: 上传数据库备份
        uses: actions/upload-artifact@v4
        with:
          name: market-db-backup
          path: data/market.db
          retention-days: 30
