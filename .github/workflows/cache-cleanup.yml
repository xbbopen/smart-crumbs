name: 清理过期数据库缓存

on:
  schedule:
    # 每天北京时间 03:17（UTC 19:17）自动执行
    - cron: '17 19 * * *'
  workflow_dispatch:

# 🚀 与 monitor / backtest / bootstrap 共用同一把锁
# 确保清理时，监控/回测绝对不会同时运行
concurrency:
  group: market-db-lock
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 只保留最新一个缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== 缓存清理开始 ==="
          echo "当前时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC') / $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')"
          echo ""

          echo "正在获取所有缓存..."
          all_caches=$(gh api "repos/$REPO/actions/caches?per_page=100" \
            --paginate \
            --jq '[.actions_caches[]]' | jq -s 'add // []')
          total=$(echo "$all_caches" | jq 'length')
          echo "当前缓存总数: $total"

          # 全局按创建时间倒序排序，保留第一个（最新），其余全部删除
          to_delete=$(echo "$all_caches" | jq -r '
            sort_by(.created_at) | reverse
            | .[1:][]
            | "\(.id)\t\(.key[:60])\t\(.size_in_bytes)"
          ')

          if [ -z "$to_delete" ]; then
            echo "只有 1 个缓存，无需清理。"
            exit 0
          fi

          delete_count=$(echo "$to_delete" | wc -l)
          echo "计划删除 $delete_count 个旧缓存，保留最新 1 个"
          echo ""

          deleted=0
          failed=0
          freed=0
          while IFS=$'\t' read -r cache_id key size; do
            [ -z "$cache_id" ] && continue
            mb=$(( size / 1048576 ))
            echo "删除 [$cache_id] ${key}... (${mb}MB)"
            if gh api --method DELETE "repos/$REPO/actions/caches/$cache_id" 2>/dev/null; then
              deleted=$((deleted + 1))
              freed=$((freed + size))
            else
              echo "警告: 删除缓存 $cache_id 失败（可能被限流，下次会重试）"
              failed=$((failed + 1))
            fi
            sleep 0.2
          done <<< "$to_delete"

          echo ""
          echo "=== 清理完成 ==="
          echo "成功删除: $deleted 个"
          echo "失败: $failed 个"
          echo "释放空间: $(( freed / 1048576 ))MB"
          if [ $failed -gt 0 ]; then
            echo ""
            echo "提示: 失败的缓存会在明天凌晨自动重试。"
          fi
