name: 清理过期数据库缓存

on:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 只保留最新一个缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "正在获取所有缓存..."
          all_caches=$(gh api "repos/$REPO/actions/caches?per_page=100" \
            --paginate \
            --jq '[.actions_caches[]]' | jq -s 'add // []')
          total=$(echo "$all_caches" | jq 'length')
          echo "当前缓存总数: $total"

          # 全局按创建时间倒序排序，保留第一个（最新），其余全部删除
          to_delete=$(echo "$all_caches" | jq -r '
            sort_by(.created_at) | reverse
            | .[1:][]
            | "\(.id)\t\(.key[:60])\t\(.size_in_bytes)"
          ')

          if [ -z "$to_delete" ]; then
            echo "只有 1 个缓存，无需清理。"
            exit 0
          fi

          delete_count=$(echo "$to_delete" | wc -l)
          echo "计划删除 $delete_count 个旧缓存，保留最新 1 个"

          deleted=0
          freed=0
          while IFS=$'\t' read -r cache_id key size; do
            [ -z "$cache_id" ] && continue
            mb=$(( size / 1048576 ))
            echo "删除 [$cache_id] ${key}... (${mb}MB)"
            if gh api --method DELETE "repos/$REPO/actions/caches/$cache_id" 2>/dev/null; then
              deleted=$((deleted + 1))
              freed=$((freed + size))
            else
              echo "警告: 删除缓存 $cache_id 失败"
            fi
          done <<< "$to_delete"

          echo ""
          echo "完成: 删除 $deleted 个旧缓存，释放 $(( freed / 1048576 ))MB。"
